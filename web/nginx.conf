server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames are content-addressed, so they can be cached
    # indefinitely — a change produces a new filename rather than a stale hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is the file that names the current
    # asset hashes, so a cached copy pins the browser to a deployment that no
    # longer exists.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The API is a separate service. Proxying it under the same origin means the
    # browser never makes a cross-origin request, so there is no CORS
    # preflight on the hot path and no third-party cookie question.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The WebSocket upgrade travels this path too.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Realtime connections are long-lived and mostly idle between events;
        # the default 60s read timeout would sever them roughly every minute.
        proxy_read_timeout 3600s;
    }

    # Client-side routing: any unknown path is a React route, not a missing
    # file, so it has to be served index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
